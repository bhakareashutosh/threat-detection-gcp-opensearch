version: '3.8'

services:
  opensearch:
    image: docker.io/opensearchproject/opensearch:2.18.0
    container_name: opensearch-node
    environment:
      - cluster.name=gcp-audit-security-lab
      - node.name=opensearch-lab-01
      - discovery.type=single-node
      - bootstrap.memory_lock=${BOOTSTRAP_MEMORY_LOCK:-false}
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
      - plugins.security.disabled=true
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    networks:
      - opensearch-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  opensearch-dashboards:
    image: docker.io/opensearchproject/opensearch-dashboards:2.18.0
    container_name: opensearch-dashboards
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - "SERVER_HOST=0.0.0.0"
    networks:
      - opensearch-net
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  opensearch-data:
    name: opensearch-data

networks:
  opensearch-net:
    name: opensearch-net
    driver: bridge
